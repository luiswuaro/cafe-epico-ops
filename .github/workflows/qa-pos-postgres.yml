name: POS database QA (isolated)

on:
  pull_request:
    paths:
      - "src/application/pos/**"
      - "scripts/qa-pos-postgres.mjs"
      - ".github/workflows/qa-pos-postgres.yml"

jobs:
  pos-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ops_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create isolated throwaway database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE ops_qa;"
      - name: Validate PostgreSQL invariants and POS reversal function
        run: node --test scripts/qa-pos-postgres.mjs
