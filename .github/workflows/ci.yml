name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      APP_ORIGIN: http://localhost:3000
      DEFAULT_ORGANIZATION_SLUG: cafe-epico
      DEFAULT_STORE_CODE: TEPEXI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash -n scripts/backup/backup-ops.sh scripts/backup/inspect-ops-backup.sh && node scripts/backup/validate-backup-safety.mjs
      - run: node --test scripts/local/lan-probe.test.mjs scripts/local/guard-qa-config.test.mjs
      - shell: pwsh
        run: ./scripts/local/check-ps-syntax.ps1
      - run: node scripts/validate-oracle-readonly.mjs
      - run: npm run validate:structure
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
